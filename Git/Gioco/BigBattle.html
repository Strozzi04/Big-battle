<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Battle</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#1d2330; --muted:#6b7280; --line:#d9d4c7;
  --accent:#2f5bd3; --accent-ink:#ffffff; --green:#3a9a5b; --yellow:#d4a72c; --gray:#9aa0a8;
  --sea:#d7e6f5; --ship:#3c4a63; --hit:#d64545; --miss:#8aa4c0; --shadow:0 2px 10px rgba(0,0,0,.08);
  --n1:#2f5bd3;--n2:#2e8b4e;--n3:#d64545;--n4:#6a3fb5;--n5:#a0522d;--n6:#138a8a;--n7:#333;--n8:#777;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171e; --panel:#1e232d; --ink:#e7e9ee; --muted:#9aa3b2; --line:#323946;
    --accent:#6b8cff; --accent-ink:#0f1320; --green:#3fa866; --yellow:#c99a1e; --gray:#4a515e;
    --sea:#1c3048; --ship:#a9b6cc; --hit:#e25b5b; --miss:#3d5874; --shadow:0 2px 10px rgba(0,0,0,.4);
  --n1:#8fb0ff;--n2:#6fd08f;--n3:#ff8a8a;--n4:#c6a6ff;--n5:#f0b27a;--n6:#6fd6d6;--n7:#e7e9ee;--n8:#aab;
  }
}
:root[data-theme="dark"]{
  --bg:#14171e; --panel:#1e232d; --ink:#e7e9ee; --muted:#9aa3b2; --line:#323946;
  --accent:#6b8cff; --accent-ink:#0f1320; --green:#3fa866; --yellow:#c99a1e; --gray:#4a515e;
  --sea:#1c3048; --ship:#a9b6cc; --hit:#e25b5b; --miss:#3d5874; --shadow:0 2px 10px rgba(0,0,0,.4);
  --n1:#8fb0ff;--n2:#6fd08f;--n3:#ff8a8a;--n4:#c6a6ff;--n5:#f0b27a;--n6:#6fd6d6;--n7:#e7e9ee;--n8:#aab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header .spacer{flex:1}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0 0 6px;font-size:22px}
p.sub{margin:0 0 18px;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=password],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text],input[type=password]{width:min(320px,100%);letter-spacing:2px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .ico{font-size:30px}
.card b{display:block;margin:6px 0 2px;font-size:17px}
.card span{color:var(--muted);font-size:14px}
.msg{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:10px 0}
.msg.ok{border-color:var(--green)} .msg.err{border-color:var(--hit)}
.hidden{display:none !important}
/* indovina */
.tiles{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}
.tile{width:40px;height:44px;display:grid;place-items:center;border-radius:7px;font-weight:700;font-size:20px;text-transform:uppercase;border:2px solid var(--line);background:var(--panel)}
.tile.g{background:var(--green);border-color:var(--green);color:#fff}
.tile.y{background:var(--yellow);border-color:var(--yellow);color:#fff}
.tile.x{background:var(--gray);border-color:var(--gray);color:#fff}
.attempt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.attempt .info{color:var(--muted);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* tris */
.tris{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(330px,100%);aspect-ratio:1;margin:10px 0}
.tris button{border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:48px;font-weight:700;cursor:pointer;color:var(--ink)}
.tris button.X{color:var(--accent)} .tris button.O{color:var(--hit)}
.tris button.win{background:var(--green);color:#fff}
.score{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.score b{color:var(--ink)}
/* battaglia */
.boards{display:flex;gap:22px;flex-wrap:wrap}
.board-wrap h3{margin:0 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:22px repeat(10,1fr);gap:2px;width:min(380px,calc(100vw - 32px))}
.grid.small{width:min(260px,calc(100vw - 32px))}
.grid .lab{font-size:11px;color:var(--muted);display:grid;place-items:center}
.grid .c{aspect-ratio:1;background:var(--sea);border-radius:3px;border:0;padding:0;cursor:pointer;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.grid .c.ship{background:var(--ship)}
.grid .c.hit{background:var(--hit)}
.grid .c.miss{background:var(--miss)}
.grid .c.prev{outline:2px solid var(--green);outline-offset:-2px}
.grid .c.bad{outline:2px solid var(--hit);outline-offset:-2px}
.grid.off .c{cursor:default}
.fleet{display:flex;gap:8px;flex-wrap:wrap}
.fleet .btn.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.92);display:grid;place-items:center;z-index:10;padding:16px}
.overlay .panel{max-width:420px;text-align:center}
/* snake */
.snake-wrap{position:relative;margin:12px 0}
#snake{display:block;border-radius:8px;border:1px solid var(--line);touch-action:none}
.snake-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:8px;font-size:18px;padding:10px}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:start}
.pad .btn{padding:10px 0}
/* campo minato */
.btn.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cm-wrap{overflow-x:auto;max-width:100%;padding-bottom:4px}
.cm{display:grid;gap:2px;width:max-content}
.cm-c{border:0;border-radius:4px;background:var(--ship);color:#fff;font-weight:800;font-size:15px;padding:0;cursor:pointer;display:grid;place-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cm-c:hover{filter:brightness(1.15)}
.cm-c.aperta{background:var(--sea);cursor:default}
.cm-c.mina{background:var(--miss)} .cm-c.boom{background:var(--hit)} .cm-c.sbagliata{background:var(--yellow)}
.cm-c.n1{color:var(--n1)}.cm-c.n2{color:var(--n2)}.cm-c.n3{color:var(--n3)}.cm-c.n4{color:var(--n4)}.cm-c.n5{color:var(--n5)}.cm-c.n6{color:var(--n6)}.cm-c.n7{color:var(--n7)}.cm-c.n8{color:var(--n8)}
.cm.off .cm-c{cursor:default}
/* sudoku */
.sd-gioco{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.sd{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);width:min(450px,calc(100vw - 32px));aspect-ratio:1;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--line);gap:1px}
.sd-c{border:0;padding:0;background:var(--panel);color:var(--accent);font-size:clamp(16px,4.6vw,24px);font-weight:600;cursor:pointer;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden}
.sd-c.fissa{color:var(--ink);font-weight:800}
.sd-c.bordo-d,.sd-c.bordo-b{position:relative;z-index:1;overflow:visible}
.sd-c.bordo-d{box-shadow:2px 0 0 var(--ink)} .sd-c.bordo-b{box-shadow:0 2px 0 var(--ink)} .sd-c.bordo-d.bordo-b{box-shadow:2px 0 0 var(--ink),0 2px 0 var(--ink),2px 2px 0 var(--ink)}
.sd-c.zona{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.sd-c.uguale{background:color-mix(in srgb,var(--accent) 24%,var(--panel))}
.sd-c.sel{background:color-mix(in srgb,var(--accent) 38%,var(--panel))}
.sd-c.conflitto{color:var(--hit)}
.sd-c.errore{background:color-mix(in srgb,var(--hit) 30%,var(--panel));color:var(--hit)}
.sd.off .sd-c{cursor:default}
.note{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(8px,1.9vw,11px);color:var(--muted);font-weight:500}
.note span{display:grid;place-items:center}
.sd-lato{display:flex;flex-direction:column;gap:12px;width:min(260px,100%)}
.sd-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sd-pad .btn{font-size:22px;font-weight:700;padding:10px 0}
.sd-azioni{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sd-azioni .btn{padding:8px 6px;font-size:14px}
.words{columns:3 140px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>⚔️ Big Battle</h1>
  <div class="spacer"></div>
  <button class="btn" id="homeBtn" onclick="vai('menu')">☰ Menu</button>
  <button class="btn" id="themeBtn" title="Tema chiaro/scuro" onclick="cambiaTema()">🌓</button>
</header>
<main id="app"></main>
<div id="overlay" class="overlay hidden"><div class="panel"><h2 id="ovTitle"></h2><p id="ovText"></p><button class="btn primary" id="ovBtn">Pronto</button></div></div>

<script>
"use strict";
/* ------------------------------------------------------------------ dati */
// Parole prese dai file parola_N.txt (una parola per riga, lettere separate da ';')
const PAROLE_BASE={"4":["arco","acne","alte","alta","alti","alto","cane","mano","zona","auto","bene","male","foto","foca","muro","film","vaso","dove","otto","lupo","lega"],"5":["guida","fiore","stalo","libro","penna","bagno","somme","disco","villa","meteo","terra","spina","sarto","morte","scudo","zaino","ponte","tutto","gioco","anima","brava","bravo","sette","pieno"],"6":["parola","foglio","doccia","adesso","valore","figlio","retina","errore","motori","giorno","cinque","quante","quanto"],"7":["fuggiva","peluche","lampada","sistema","nutella","mensola","cuscino","piumone","schermo","uccello","capelli","monitor","pioggia","perdono"],"8":["pilastro","quaderno","tastiera","astuccio","computer","internet","macchina","lenzuolo","cartella","cappello","esercito","montagna","cadaveri","vendetta","scodella","bancomat","finestra","custodia","studiare","batterie","modalita","paradiso"],"9":["confronto","discoteca","selvaggio","tartaruga","giocatore","artmetica","traditore","sarcofago","contadino","formaggio"],"10":["fabbisogni","fazzoletto","pimsatrice","conoscenza","ricompensa","sofferenza","matematica"],"11":["pozzanghera","volatizzate"],"12":["fabbricabile","cioccolatino"],"13":["magazzinaggio"],"14":["falsificazione"],"15":["faciliterebbero","moltiplicazione"]};
const CHIAVE_PAROLE="bigbattle-parole-aggiunte";

function paroleAggiunte(){
  try{ return JSON.parse(localStorage.getItem(CHIAVE_PAROLE))||[]; }catch(e){ return []; }
}
function salvaParoleAggiunte(l){
  try{ localStorage.setItem(CHIAVE_PAROLE,JSON.stringify(l)); return true; }catch(e){ return false; }
}
function tutteLeParole(n){
  const base=PAROLE_BASE[n]||[];
  return base.concat(paroleAggiunte().filter(p=>p.length===n&&!base.includes(p)));
}

/* --------------------------------------------------------------- utilita' */
const $=s=>document.querySelector(s);
const app=$("#app");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function casuale(n){return Math.floor(Math.random()*n);}
function cambiaTema(){
  const r=document.documentElement;
  const scuro=r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=scuro?"light":"dark";
  try{localStorage.setItem("bigbattle-tema",r.dataset.theme);}catch(e){}
}
try{const t=localStorage.getItem("bigbattle-tema"); if(t) document.documentElement.dataset.theme=t;}catch(e){}

function overlay(titolo,testo,bottone,poi){
  $("#ovTitle").textContent=titolo; $("#ovText").textContent=testo; $("#ovBtn").textContent=bottone||"Pronto";
  $("#overlay").classList.remove("hidden");
  $("#ovBtn").onclick=()=>{ $("#overlay").classList.add("hidden"); if(poi) poi(); };
  $("#ovBtn").focus();
}

/* ------------------------------------------------------------------- menu */
const VOCI=[
  ["pin2","🔢","Indovina il pin","Un giocatore decide il pin, l'altro lo indovina"],
  ["parola2","🔤","Indovina la parola","Un giocatore decide la parola, l'altro la indovina"],
  ["pin1","🎲","Single player pin","Il pin viene generato a caso"],
  ["parola1","📖","Single player parola","La parola viene scelta dal dizionario"],
  ["battaglia","🚢","Battaglia navale","2 giocatori sullo stesso computer o contro il computer"],
  ["tris","❌","Tris","2 giocatori o contro il computer"],
  ["snake","🐍","Snake","Mangia le mele e diventa lunghissimo"],
  ["campo","💣","Campo minato","Scopri tutte le caselle senza far esplodere le mine"],
  ["sudoku","🔢","Sudoku","Riempi la griglia con i numeri da 1 a 9"],
  ["aggiungi","➕","Aggiungi una parola","Amplia il dizionario della modalità single player"],
];
let ferma=null; // funzione per fermare il gioco in corso (timer, tasti)
function vai(dove){
  if(ferma){ ferma(); ferma=null; }
  document.onkeydown=null;
  if(cm) clearInterval(cm.timer);
  window.scrollTo(0,0);
  $("#overlay").classList.add("hidden");
  ({menu:mostraMenu,pin2:()=>impostaIndovina("pin",2),parola2:()=>impostaIndovina("parola",2),
    pin1:()=>impostaIndovina("pin",1),parola1:()=>impostaIndovina("parola",1),
    battaglia:impostaBattaglia,tris:impostaTris,snake:impostaSnake,campo:impostaCampoMinato,sudoku:impostaSudoku,aggiungi:mostraAggiungi})[dove]();
}
function mostraMenu(){
  app.innerHTML=`<h2>Cosa vuoi fare?</h2><p class="sub">Scegli un gioco</p><div class="menu">${
    VOCI.map(v=>`<button class="card" onclick="vai('${v[0]}')"><div class="ico">${v[1]}</div><b>${v[2]}</b><span>${v[3]}</span></button>`).join("")
  }</div>`;
}

/* ------------------------------------------------- indovina pin / parola */
const DIFFICOLTA={
  1:["Facile","Saprai tutto: in verde i caratteri nella posizione corretta, in giallo quelli presenti ma nella posizione sbagliata."],
  2:["Media","Saprai quali caratteri hai indovinato solo se sono nella posizione giusta."],
  3:["Difficile","Saprai soltanto quanti caratteri hai indovinato nella posizione corretta."],
};
function testiGioco(tipo){
  return tipo==="pin"
    ? {nome:"pin",art:"il",unita:"cifre",un:"un",o:"o",regex:/^[0-9]+$/,soloMsg:"Il pin può contenere solo cifre."}
    : {nome:"parola",art:"la",unita:"lettere",un:"una",o:"a",regex:/^[a-z]+$/,soloMsg:"La parola può contenere solo lettere (senza accenti)."};
}
function impostaIndovina(tipo,giocatori){
  const t=testiGioco(tipo);
  const titolo=giocatori===2?`Indovina ${t.art} ${t.nome}`:`Single player ${t.nome}`;
  let campo;
  if(giocatori===2){
    campo=`<label>Giocatore 1: scrivi ${t.art} ${t.nome} segret${t.o} (l'altro giocatore non deve guardare)</label>
      <input type="password" id="segreto" autocomplete="off" ${tipo==="pin"?'inputmode="numeric"':''}>`;
  }else if(tipo==="pin"){
    campo=`<label>Da quante cifre deve essere il pin?</label><input type="number" id="lung" min="3" max="12" value="4">`;
  }else{
    const opz=[];
    for(let n=4;n<=15;n++){ const k=tutteLeParole(n).length; opz.push(`<option value="${n}" ${k?"":"disabled"} ${n===5?"selected":""}>${n} lettere (${k} parole)</option>`); }
    campo=`<label>Numero di lettere</label><select id="lung">${opz.join("")}</select>`;
  }
  app.innerHTML=`<h2>${titolo}</h2><p class="sub">Imposta la partita</p>
  <div class="panel">
    ${campo}
    <div class="row" style="margin-top:16px">
      <div><label>Difficoltà</label><select id="diff">${Object.entries(DIFFICOLTA).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></div>
      <div><label>Tentativi</label><input type="number" id="tent" min="1" value="6" style="width:90px"></div>
    </div>
    <p class="sub" id="diffInfo"></p>
    <div id="err"></div>
    <button class="btn primary" id="inizia">Inizia</button>
  </div>`;
  const aggiornaInfo=()=>{
    const d=+$("#diff").value; let s=DIFFICOLTA[d][1].replace("caratteri",t.unita);
    if(d===2) s+=` Massimo tentativi: 2 × numero di ${t.unita}.`;
    if(d===3) s+=` Massimo tentativi: numero di ${t.unita}.`;
    $("#diffInfo").textContent=s;
  };
  $("#diff").onchange=aggiornaInfo; aggiornaInfo();
  const errore=m=>{$("#err").innerHTML=`<div class="msg err">${esc(m)}</div>`;};
  $("#inizia").onclick=()=>{
    let segreto;
    if(giocatori===2){
      segreto=$("#segreto").value.trim().toLowerCase();
      if(segreto.length<2) return errore(`${t.art[0].toUpperCase()+t.art.slice(1)} ${t.nome} deve avere almeno 2 ${t.unita}.`);
      if(segreto.length>15) return errore(`Massimo 15 ${t.unita}.`);
      if(!t.regex.test(segreto)) return errore(t.soloMsg);
    }else if(tipo==="pin"){
      const n=+$("#lung").value;
      if(!(n>=3&&n<=12)) return errore("Il pin deve essere da 3 a 12 cifre.");
      segreto=Array.from({length:n},()=>casuale(10)).join("");
    }else{
      const l=tutteLeParole(+$("#lung").value);
      if(!l.length) return errore("Non ci sono parole di questa lunghezza: aggiungile dal menu.");
      segreto=l[casuale(l.length)];
    }
    const d=+$("#diff").value, n=segreto.length, tent=Math.floor(+$("#tent").value);
    const max=d===2?n*2:d===3?n:Infinity;
    if(!(tent>=1)) return errore("Devi fare almeno un tentativo.");
    if(tent>max) return errore(`In difficoltà ${DIFFICOLTA[d][0].toLowerCase()} puoi fare al massimo ${max} tentativi (${t.art} ${t.nome} è da ${n} ${t.unita}).`);
    giocaIndovina({tipo,giocatori,segreto,diff:d,tentativi:tent,fatti:[],finito:false});
  };
}
// stato per ogni carattere: 2 = posizione corretta, 1 = presente altrove, 0 = assente
function valuta(tentativo,soluzione){
  const n=soluzione.length, stato=Array(n).fill(0), rimasti={};
  for(let i=0;i<n;i++){
    if(tentativo[i]===soluzione[i]) stato[i]=2; else rimasti[soluzione[i]]=(rimasti[soluzione[i]]||0)+1;
  }
  for(let i=0;i<n;i++){
    if(stato[i]===0&&rimasti[tentativo[i]]>0){ stato[i]=1; rimasti[tentativo[i]]--; }
  }
  return stato;
}
function giocaIndovina(g){
  const t=testiGioco(g.tipo), n=g.segreto.length;
  const righe=g.fatti.map(({parola,stato})=>{
    const giuste=stato.filter(s=>s===2).length;
    let celle;
    if(g.diff===1) celle=[...parola].map((c,i)=>`<div class="tile ${["x","y","g"][stato[i]]}">${esc(c)}</div>`).join("");
    else if(g.diff===2) celle=[...parola].map((c,i)=>`<div class="tile ${stato[i]===2?"g":""}">${esc(c)}</div>`).join("");
    else celle=[...parola].map(c=>`<div class="tile">${esc(c)}</div>`).join("");
    return `<div class="attempt"><div class="tiles">${celle}</div><div class="info">${giuste}/${n} ${t.unita} nella posizione giusta</div></div>`;
  }).join("");
  const rimasti=g.tentativi-g.fatti.length;
  const legenda=g.diff===1?`<div class="legend"><span><i style="background:var(--green)"></i>posizione corretta</span><span><i style="background:var(--yellow)"></i>presente, posizione sbagliata</span><span><i style="background:var(--gray)"></i>assente</span></div>`
    :g.diff===2?`<div class="legend"><span><i style="background:var(--green)"></i>posizione corretta</span></div>`:"";
  let fondo;
  if(g.finito){
    const vinto=g.fatti.length&&g.fatti[g.fatti.length-1].parola===g.segreto;
    fondo=`<div class="msg ${vinto?"ok":"err"}">${vinto?`🎉 Hai indovinato ${t.art} ${t.nome} in ${g.fatti.length} tentativ${g.fatti.length===1?"o":"i"}!`:`Hai finito i tentativi. ${t.art[0].toUpperCase()+t.art.slice(1)} ${t.nome} era: <b>${esc(g.segreto.toUpperCase())}</b>`}</div>
      <div class="row"><button class="btn primary" onclick="vai('${g.tipo}${g.giocatori}')">Nuova partita</button><button class="btn" onclick="vai('menu')">Menu</button></div>`;
  }else{
    fondo=`<div class="row"><input type="text" id="tentativo" maxlength="${n}" autocomplete="off" placeholder="${"_".repeat(n)}" ${g.tipo==="pin"?'inputmode="numeric"':''}>
      <button class="btn primary" id="prova">Prova</button><button class="btn" id="arrenditi">Arrenditi</button></div><div id="err"></div>`;
  }
  app.innerHTML=`<h2>${g.giocatori===2?`Indovina ${t.art} ${t.nome}`:`Single player ${t.nome}`}</h2>
    <p class="sub">${t.art[0].toUpperCase()+t.art.slice(1)} ${t.nome} è da ${n} ${t.unita} · difficoltà ${DIFFICOLTA[g.diff][0].toLowerCase()} · tentativi rimasti: ${rimasti}</p>
    <div class="panel">${legenda}${righe||'<p class="sub">Nessun tentativo ancora.</p>'}${fondo}</div>`;
  if(g.finito) return;
  const inp=$("#tentativo"); inp.focus();
  const prova=()=>{
    const v=inp.value.trim().toLowerCase();
    if(v.length!==n){ $("#err").innerHTML=`<div class="msg err">Devi inserire esattamente ${n} ${t.unita}.</div>`; return; }
    if(!t.regex.test(v)){ $("#err").innerHTML=`<div class="msg err">${t.soloMsg}</div>`; return; }
    g.fatti.push({parola:v,stato:valuta(v,g.segreto)});
    if(v===g.segreto||g.fatti.length>=g.tentativi) g.finito=true;
    giocaIndovina(g);
  };
  $("#prova").onclick=prova;
  inp.onkeydown=e=>{ if(e.key==="Enter") prova(); };
  $("#arrenditi").onclick=()=>{ g.finito=true; giocaIndovina(g); };
}

/* ------------------------------------------------------------------- tris */
const LINEE=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const punteggio={X:0,O:0,pari:0};
let tris=null;
function vincitoreTris(c){
  for(const l of LINEE){ if(c[l[0]]&&c[l[0]]===c[l[1]]&&c[l[1]]===c[l[2]]) return {chi:c[l[0]],linea:l}; }
  return c.every(Boolean)?{chi:"pari",linea:[]}:null;
}
// minimax: il computer (O) non perde mai, a difficolta' "facile" sbaglia a volte
function minimax(c,turno){
  const v=vincitoreTris(c);
  if(v) return {p:v.chi==="O"?10:v.chi==="X"?-10:0};
  let migliore=null;
  for(let i=0;i<9;i++){
    if(c[i]) continue;
    c[i]=turno; const r=minimax(c,turno==="O"?"X":"O"); c[i]=null;
    const p=r.p*0.9;
    if(!migliore||(turno==="O"?p>migliore.p:p<migliore.p)) migliore={p,i};
  }
  return migliore;
}
function impostaTris(){
  app.innerHTML=`<h2>Tris</h2><p class="sub">Il giocatore 1 è la X, il giocatore 2 la O. Chi comincia viene deciso a caso.</p>
  <div class="panel"><div class="row">
    <div><label>Avversario</label><select id="avv"><option value="2">Giocatore 2</option><option value="cpu">Computer</option></select></div>
    <div id="livWrap" class="hidden"><label>Livello computer</label><select id="liv"><option value="facile">Facile</option><option value="imbattibile" selected>Imbattibile</option></select></div>
  </div><button class="btn primary" id="via">Gioca</button></div>`;
  $("#avv").onchange=()=>$("#livWrap").classList.toggle("hidden",$("#avv").value!=="cpu");
  $("#via").onclick=()=>{ tris={celle:Array(9).fill(null),cpu:$("#avv").value==="cpu",livello:$("#liv").value,turno:casuale(2)?"X":"O",fine:null}; disegnaTris(); mossaCpu(); };
}
function nomeTris(s){ return s==="X"?"Giocatore 1 (X)":(tris.cpu?"Computer (O)":"Giocatore 2 (O)"); }
function disegnaTris(){
  const f=tris.fine;
  const stato=f?(f.chi==="pari"?"Pareggio!":`Ha vinto ${nomeTris(f.chi)}! 🎉`):`Tocca a ${nomeTris(tris.turno)}`;
  app.innerHTML=`<h2>Tris</h2>
  <div class="score"><span>${nomeTris("X")}: <b>${punteggio.X}</b></span><span>${nomeTris("O")}: <b>${punteggio.O}</b></span><span>Pareggi: <b>${punteggio.pari}</b></span></div>
  <div class="msg ${f?"ok":""}">${stato}</div>
  <div class="tris">${tris.celle.map((c,i)=>`<button class="${c||""} ${f&&f.linea.includes(i)?"win":""}" data-i="${i}" aria-label="casella ${Math.floor(i/3)},${i%3}">${c||""}</button>`).join("")}</div>
  <div class="row"><button class="btn primary" id="rivincita">${f?"Rivincita":"Ricomincia"}</button><button class="btn" onclick="impostaTris()">Cambia avversario</button></div>`;
  app.querySelectorAll(".tris button").forEach(b=>b.onclick=()=>{
    if(tris.fine||(tris.cpu&&tris.turno==="O")) return;
    giocaTris(+b.dataset.i);
  });
  $("#rivincita").onclick=()=>{ tris.celle=Array(9).fill(null); tris.fine=null; tris.turno=casuale(2)?"X":"O"; disegnaTris(); mossaCpu(); };
}
function giocaTris(i){
  if(tris.celle[i]||tris.fine) return; // casella occupata: non si puo' sovrascrivere
  tris.celle[i]=tris.turno;
  tris.fine=vincitoreTris(tris.celle);
  if(tris.fine) punteggio[tris.fine.chi]++;
  else tris.turno=tris.turno==="X"?"O":"X";
  disegnaTris(); mossaCpu();
}
function mossaCpu(){
  if(!tris.cpu||tris.fine||tris.turno!=="O") return;
  setTimeout(()=>{
    const libere=tris.celle.map((c,i)=>c?null:i).filter(i=>i!==null);
    const i=(tris.livello==="facile"&&Math.random()<0.45)?libere[casuale(libere.length)]:minimax(tris.celle.slice(),"O").i;
    giocaTris(i);
  },400);
}

/* -------------------------------------------------------- battaglia navale */
const N=10, FLOTTA=[2,3,4,5];
let bn=null;
function nuovoGiocatore(nome){ return {nome,navi:[],tab:Array.from({length:N},()=>Array(N).fill(0)),colpi:Array.from({length:N},()=>Array(N).fill(0))}; }
// tab: 0 = mare, 1 = nave, 2 = nave colpita ; colpi (attacchi fatti): 0 = niente, 2 = colpito, 3 = acqua
function celleNave(x,y,lung,orizz){ return Array.from({length:lung},(_,i)=>orizz?[y,x+i]:[y+i,x]); }
function puoiPiazzare(g,celle){ return celle.every(([r,c])=>r>=0&&r<N&&c>=0&&c<N&&g.tab[r][c]===0); }
function piazzaCasuale(g){
  for(const lung of FLOTTA){
    let celle;
    do{ celle=celleNave(casuale(N),casuale(N),lung,casuale(2)===0); }while(!puoiPiazzare(g,celle));
    celle.forEach(([r,c])=>g.tab[r][c]=1); g.navi.push({lung,celle});
  }
}
function impostaBattaglia(){
  app.innerHTML=`<h2>Battaglia navale</h2><p class="sub">Tabellone 10×10, ogni giocatore ha 4 navi: da 2, 3, 4 e 5 caselle.</p>
  <div class="panel"><label>Avversario</label><select id="avv"><option value="2">Giocatore 2 (stesso computer)</option><option value="cpu">Computer</option></select>
  <div class="row"><button class="btn primary" id="via">Inizia</button></div></div>`;
  $("#via").onclick=()=>{
    const cpu=$("#avv").value==="cpu";
    bn={cpu,g:[nuovoGiocatore("Giocatore 1"),nuovoGiocatore(cpu?"Computer":"Giocatore 2")],turno:0,fine:false,orizz:true,scelta:0,ultimo:"",bersagli:[]};
    if(cpu) piazzaCasuale(bn.g[1]);
    posizionamento(0);
  };
}
function htmlGriglia(id,celle,cls){
  let h=`<div class="grid ${cls||""}" id="${id}"><div></div>`;
  for(let c=0;c<N;c++) h+=`<div class="lab">${c}</div>`;
  for(let r=0;r<N;r++){ h+=`<div class="lab">${r}</div>`; for(let c=0;c<N;c++) h+=celle(r,c); }
  return h+"</div>";
}
function posizionamento(idx){
  const g=bn.g[idx];
  const mancanti=FLOTTA.filter(l=>!g.navi.some(n=>n.lung===l));
  if(!mancanti.includes(bn.scelta)) bn.scelta=mancanti[0]||0;
  app.innerHTML=`<h2>${esc(g.nome)}: posiziona le navi</h2>
  <p class="sub">Scegli una nave, poi clicca sulla casella di partenza. Premi <b>R</b> o il pulsante per ruotarla. Clicca una nave già piazzata per toglierla.</p>
  <div class="panel">
    <div class="fleet">${FLOTTA.map(l=>`<button class="btn ${bn.scelta===l?"sel":""}" data-l="${l}" ${mancanti.includes(l)?"":"disabled"}>Nave da ${l}</button>`).join("")}</div>
    <div class="row"><button class="btn" id="ruota">↻ ${bn.orizz?"Orizzontale":"Verticale"}</button><button class="btn" id="caso">🎲 A caso</button><button class="btn" id="svuota">Svuota</button></div>
    ${htmlGriglia("piazza",(r,c)=>`<button class="c ${g.tab[r][c]?"ship":""}" data-r="${r}" data-c="${c}" aria-label="riga ${r} colonna ${c}"></button>`)}
    <div class="row"><button class="btn primary" id="fatto" ${mancanti.length?"disabled":""}>Conferma</button></div>
  </div>`;
  app.querySelectorAll(".fleet .btn").forEach(b=>b.onclick=()=>{ bn.scelta=+b.dataset.l; posizionamento(idx); });
  $("#ruota").onclick=()=>{ bn.orizz=!bn.orizz; posizionamento(idx); };
  $("#caso").onclick=()=>{ bn.g[idx]=nuovoGiocatore(g.nome); piazzaCasuale(bn.g[idx]); posizionamento(idx); };
  $("#svuota").onclick=()=>{ bn.g[idx]=nuovoGiocatore(g.nome); posizionamento(idx); };
  const celleDom=[...app.querySelectorAll("#piazza .c")];
  const anteprima=(r,c)=>{
    celleDom.forEach(e=>e.classList.remove("prev","bad"));
    if(!bn.scelta||r===null) return;
    const celle=celleNave(c,r,bn.scelta,bn.orizz), ok=puoiPiazzare(g,celle);
    celle.forEach(([rr,cc])=>{ if(rr<N&&cc<N) celleDom[rr*N+cc].classList.add(ok?"prev":"bad"); });
  };
    celleDom.forEach(e=>{
    const r=+e.dataset.r,c=+e.dataset.c;
    e.onmouseenter=()=>anteprima(r,c);
    e.onclick=()=>{
      const nave=g.navi.find(n=>n.celle.some(([rr,cc])=>rr===r&&cc===c));
      if(nave){ nave.celle.forEach(([rr,cc])=>g.tab[rr][cc]=0); g.navi.splice(g.navi.indexOf(nave),1); bn.scelta=nave.lung; posizionamento(idx); return; }
      if(!bn.scelta) return;
      const celle=celleNave(c,r,bn.scelta,bn.orizz);
      if(!puoiPiazzare(g,celle)) return;
      celle.forEach(([rr,cc])=>g.tab[rr][cc]=1); g.navi.push({lung:bn.scelta,celle});
      posizionamento(idx);
    };
  });
  $("#piazza").onmouseleave=()=>anteprima(null,null);
  document.onkeydown=e=>{ if((e.key==="r"||e.key==="R")&&$("#piazza")){ bn.orizz=!bn.orizz; posizionamento(idx); } };
  $("#fatto").onclick=()=>{
    document.onkeydown=null;
    if(idx===0&&!bn.cpu) overlay("Passa al Giocatore 2","Il Giocatore 1 non deve guardare lo schermo.","Sono il Giocatore 2",()=>posizionamento(1));
    else iniziaTurno();
  };
}
function iniziaTurno(){
  if(bn.cpu||bn.fine) return turnoBattaglia();
  overlay(`Turno di ${bn.g[bn.turno].nome}`,`${bn.g[1-bn.turno].nome} non deve guardare lo schermo.`,"Sono pronto",turnoBattaglia);
}
function rimaste(g){ return g.tab.flat().filter(v=>v===1).length; }
function affondata(g,nave){ return nave.celle.every(([r,c])=>g.tab[r][c]===2); }
function turnoBattaglia(){
  const io=bn.g[bn.turno], lui=bn.g[1-bn.turno];
  // con il computer si vede sempre il punto di vista del giocatore 1
  const vista=bn.cpu?bn.g[0]:io, avv=bn.cpu?bn.g[1]:lui;
  const mio=bn.cpu?(bn.turno===0):!bn.attesa;
  const stato=bn.fine?`<div class="msg ok">🏆 Ha vinto ${esc(bn.fine)}!</div>`:`<div class="msg">${bn.attesa?"Turno finito.":mio?`Tocca a <b>${esc(io.nome)}</b>: clicca una casella del tabellone avversario per sparare.`:"Il computer sta pensando..."}</div>`;
  const naviAvv=avv.navi.map(n=>`<span>${affondata(avv,n)?"💥":"🚢"} da ${n.lung}</span>`).join(" ");
  app.innerHTML=`<h2>Battaglia navale</h2>${stato}
  ${bn.ultimo?`<p class="sub">${esc(bn.ultimo)}</p>`:""}
  <div class="boards">
    <div class="board-wrap"><h3>Tabellone attacchi di ${esc(vista.nome)}</h3>
      ${htmlGriglia("attacco",(r,c)=>{const v=vista.colpi[r][c]; const mostra=bn.fine&&avv.tab[r][c]===1;
        return `<button class="c ${v===2?"hit":v===3?"miss":mostra?"ship":""}" data-r="${r}" data-c="${c}" aria-label="riga ${r} colonna ${c}">${v===2?"✕":v===3?"•":""}</button>`;},(bn.fine||!mio)?"off":"")}
      <p class="sub" style="margin-top:8px">Navi avversarie: ${naviAvv}</p></div>
    <div class="board-wrap"><h3>Le tue navi (${rimaste(vista)} caselle intatte)</h3>
      ${htmlGriglia("mie",(r,c)=>{const v=vista.tab[r][c], acqua=avv.colpi[r][c]===3;
        return `<div class="c ${v===1?"ship":v===2?"hit":acqua?"miss":""}">${v===2?"✕":acqua?"•":""}</div>`;},"small off")}</div>
  </div>
  <div class="row">${bn.fine?`<button class="btn primary" onclick="impostaBattaglia()">Nuova partita</button>`:""}<button class="btn" onclick="vai('menu')">Menu</button></div>`;
  if(bn.fine) return;
  if(bn.attesa) return;
  if(!mio){ setTimeout(mossaComputer,600); return; }
  app.querySelectorAll("#attacco .c").forEach(e=>e.onclick=()=>{
    const r=+e.dataset.r,c=+e.dataset.c;
    if(io.colpi[r][c]) return; // casella gia' attaccata
    spara(r,c);
  });
}
function spara(r,c){
  const io=bn.g[bn.turno], lui=bn.g[1-bn.turno];
  const coord=`(y ${r}, x ${c})`;
  if(lui.tab[r][c]===1){
    lui.tab[r][c]=2; io.colpi[r][c]=2;
    const nave=lui.navi.find(n=>n.celle.some(([rr,cc])=>rr===r&&cc===c));
    bn.ultimo=`${io.nome} ${coord}: colpito${affondata(lui,nave)?` e affondato la nave da ${nave.lung}!`:"!"}`;
    if(bn.cpu&&bn.turno===1){ if(affondata(lui,nave)) bn.bersagli=[]; else bn.bersagli.push([r,c]); }
  }else{
    io.colpi[r][c]=3; bn.ultimo=`${io.nome} ${coord}: acqua.`;
  }
  if(rimaste(lui)===0){ bn.fine=io.nome; return turnoBattaglia(); }
  if(bn.cpu){ bn.turno=1-bn.turno; return turnoBattaglia(); }
  // due giocatori: si mostra il risultato del colpo, poi si passa il computer all'altro
  bn.attesa=true; turnoBattaglia();
  setTimeout(()=>overlay(bn.ultimo,`Ora tocca a ${lui.nome}. ${io.nome} non deve guardare.`,"Sono pronto",()=>{ bn.attesa=false; bn.turno=1-bn.turno; turnoBattaglia(); }),900);
}
// il computer spara a caso finche' non colpisce, poi cerca intorno al colpo
function mossaComputer(){
  const io=bn.g[1], libera=(r,c)=>r>=0&&r<N&&c>=0&&c<N&&!io.colpi[r][c];
  let candidati=[];
  const colpiti=bn.bersagli.filter(([r,c])=>bn.g[0].tab[r][c]===2);
  if(colpiti.length>=2){
    const orizz=colpiti[0][0]===colpiti[1][0];
    const ord=colpiti.slice().sort((a,b)=>orizz?a[1]-b[1]:a[0]-b[0]);
    const [p,u]=[ord[0],ord[ord.length-1]];
    candidati=orizz?[[p[0],p[1]-1],[u[0],u[1]+1]]:[[p[0]-1,p[1]],[u[0]+1,u[1]]];
    candidati=candidati.filter(([r,c])=>libera(r,c));
  }
  if(!candidati.length) for(const [r,c] of colpiti) for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]) if(libera(r+dr,c+dc)) candidati.push([r+dr,c+dc]);
  if(!candidati.length){ for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(libera(r,c)&&(r+c)%2===0) candidati.push([r,c]); }
  if(!candidati.length){ for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(libera(r,c)) candidati.push([r,c]); }
  const [r,c]=candidati[casuale(candidati.length)];
  spara(r,c);
}

/* --------------------------------------------------------- aggiungi parola */
function mostraAggiungi(messaggio){
  const agg=paroleAggiunte();
  app.innerHTML=`<h2>Aggiungi una parola</h2><p class="sub">La parola sarà usata nella modalità single player. Da 4 a 15 lettere, senza accenti.</p>
  <div class="panel">
    <div class="row"><input type="text" id="nuova" maxlength="15" autocomplete="off" placeholder="nuova parola"><button class="btn primary" id="aggiungi">Aggiungi</button></div>
    <div id="esito">${messaggio||""}</div>
    <p class="sub" style="margin-top:14px">Le parole aggiunte qui vengono salvate in questo browser. Per aggiungerle anche ai file <code>parola_N.txt</code> usa l'opzione 7 del programma da console.</p>
  </div>
  <div class="panel"><h3 style="margin-top:0">Parole aggiunte (${agg.length})</h3>
    ${agg.length?`<div class="words">${agg.map((p,i)=>`<div>${esc(p)} <button class="btn" style="padding:0 6px" data-i="${i}" title="rimuovi">✕</button></div>`).join("")}</div>`:'<p class="sub">Nessuna parola aggiunta.</p>'}
  </div>`;
  const inp=$("#nuova"); inp.focus();
  const aggiungi=()=>{
    const p=inp.value.trim().toLowerCase();
    const err=m=>mostraAggiungi(`<div class="msg err">${esc(m)}</div>`);
    if(!/^[a-z]+$/.test(p)) return err("La parola può contenere solo lettere (senza accenti).");
    if(p.length<4||p.length>15) return err("La parola deve essere da 4 a 15 lettere.");
    if(tutteLeParole(p.length).includes(p)) return err("Parola già esistente nel sistema.");
    const l=paroleAggiunte(); l.push(p);
    if(!salvaParoleAggiunte(l)) return err("Il browser non permette di salvare le parole.");
    mostraAggiungi(`<div class="msg ok">Parola "${esc(p)}" aggiunta (${p.length} lettere).</div>`);
  };
  $("#aggiungi").onclick=aggiungi;
  inp.onkeydown=e=>{ if(e.key==="Enter") aggiungi(); };
  app.querySelectorAll(".words .btn").forEach(b=>b.onclick=()=>{ const l=paroleAggiunte(); l.splice(+b.dataset.i,1); salvaParoleAggiunte(l); mostraAggiungi(); });
}

/* ------------------------------------------------------------------ snake */
const SN_L=30, SN_A=18;
function impostaSnake(){
  let record=0; try{ record=+localStorage.getItem("bigbattle-snake-record")||0; }catch(e){}
  app.innerHTML=`<h2>Snake</h2><p class="sub">Mangia le mele senza toccare il bordo o la tua coda. Frecce o W A S D per muoverti, P o spazio per la pausa. Da telefono: scorri sul campo o usa i pulsanti.</p>
  <div class="panel">
    <div class="row"><div><label>Velocità</label><select id="vel"><option value="1">Lento</option><option value="2" selected>Normale</option><option value="3">Veloce</option></select></div>
      <button class="btn primary" id="via" style="align-self:flex-end">Gioca</button></div>
    <div class="score"><span>Punti: <b id="snPunti">0</b></span><span>Lunghezza: <b id="snLung">3</b></span><span>Record: <b id="snRecord">${record}</b></span></div>
    <div class="snake-wrap"><canvas id="snake"></canvas><div class="snake-msg" id="snMsg">Premi <b>Gioca</b> per iniziare</div></div>
    <div class="pad"><span></span><button class="btn" data-d="w" aria-label="su">▲</button><span></span>
      <button class="btn" data-d="a" aria-label="sinistra">◀</button><button class="btn" data-d="p" aria-label="pausa">⏸</button><button class="btn" data-d="d" aria-label="destra">▶</button>
      <span></span><button class="btn" data-d="s" aria-label="giu">▼</button><span></span></div>
  </div>`;
  const cv=$("#snake"), ctx=cv.getContext("2d");
  let s=null, timer=null;
  const colore=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const lato=()=>Math.floor(Math.min(600,cv.closest(".panel").clientWidth-38)/SN_L);
  function ridimensiona(){
    const l=Math.max(8,lato()); cv.width=l*SN_L*devicePixelRatio; cv.height=l*SN_A*devicePixelRatio;
    cv.parentElement.style.width=cv.style.width=(l*SN_L)+"px"; cv.style.height=(l*SN_A)+"px"; disegna();
  }
  function disegna(){
    const l=cv.width/SN_L;
    ctx.fillStyle=colore("--sea"); ctx.fillRect(0,0,cv.width,cv.height);
    if(!s) return;
    ctx.fillStyle=colore("--hit");
    ctx.beginPath(); ctx.arc((s.mela.x+.5)*l,(s.mela.y+.5)*l,l*.4,0,Math.PI*2); ctx.fill();
    s.corpo.forEach((p,i)=>{
      ctx.fillStyle=i===0?colore("--accent"):colore("--green");
      ctx.fillRect(p.x*l+1,p.y*l+1,l-2,l-2);
    });
  }
  function messaggio(html){ $("#snMsg").innerHTML=html; $("#snMsg").classList.toggle("hidden",!html); }
  function aggiornaPunti(){ $("#snPunti").textContent=s.punti; $("#snLung").textContent=s.corpo.length; $("#snRecord").textContent=record; }
  function nuovaMela(){
    if(s.corpo.length>=SN_L*SN_A) return false;
    do{ s.mela={x:casuale(SN_L),y:casuale(SN_A)}; }while(s.corpo.some(p=>p.x===s.mela.x&&p.y===s.mela.y));
    return true;
  }
  function inizia(){
    clearTimeout(timer);
    const liv=+$("#vel").value;
    s={corpo:[0,1,2].map(i=>({x:SN_L/2-i,y:SN_A/2})),dir:{x:1,y:0},coda:[],punti:0,liv,attesa:[160,110,70][liv-1],pausa:false,fine:false};
    nuovaMela(); aggiornaPunti(); messaggio(""); disegna();
    timer=setTimeout(passo,s.attesa);
  }
  function passo(){
    if(!s||s.fine||s.pausa) return;
    if(s.coda.length) s.dir=s.coda.shift();
    const t={x:s.corpo[0].x+s.dir.x,y:s.corpo[0].y+s.dir.y};
    const mangia=t.x===s.mela.x&&t.y===s.mela.y;
    // se non mangia la coda si sposta, quindi la sua casella si libera
    const corpo=mangia?s.corpo:s.corpo.slice(0,-1);
    if(t.x<0||t.x>=SN_L||t.y<0||t.y>=SN_A||corpo.some(p=>p.x===t.x&&p.y===t.y)) return fine(false);
    if(!mangia) s.corpo.pop();
    s.corpo.unshift(t);
    if(mangia){ s.punti+=10*s.liv; if(!nuovaMela()) return fine(true); }
    aggiornaPunti(); disegna();
    timer=setTimeout(passo,s.attesa);
  }
  function fine(vinto){
    s.fine=true; disegna();
    let m=vinto?"🏆 Hai riempito tutto il campo!":`Game over! Hai fatto <b>${s.punti}</b> punti`;
    if(s.punti>record){ record=s.punti; try{localStorage.setItem("bigbattle-snake-record",record);}catch(e){} m+="<br>🎉 Nuovo record!"; }
    aggiornaPunti(); messaggio(m+"<br><small>Premi Gioca per riprovare</small>");
  }
  function pausa(){
    if(!s||s.fine) return;
    s.pausa=!s.pausa; messaggio(s.pausa?"Pausa":"");
    if(!s.pausa) timer=setTimeout(passo,s.attesa);
  }
  const DIREZIONI={w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  function cambia(k){
    if(k==="p") return pausa();
    const d=DIREZIONI[k]; if(!d||!s||s.fine||s.pausa) return;
    // si confronta con l'ultima direzione in coda: non si puo' tornare indietro sul corpo
    const ult=s.coda.length?s.coda[s.coda.length-1]:s.dir;
    if((d.x===-ult.x&&d.y===-ult.y)||(d.x===ult.x&&d.y===ult.y)||s.coda.length>=2) return;
    s.coda.push(d);
  }
  const TASTI={ArrowUp:"w",ArrowDown:"s",ArrowLeft:"a",ArrowRight:"d",w:"w",s:"s",a:"a",d:"d",W:"w",S:"s",A:"a",D:"d",p:"p",P:"p"," ":"p"};
  document.onkeydown=e=>{ const k=TASTI[e.key]; if(!k||e.target.tagName==="SELECT") return; e.preventDefault(); cambia(k); };
  app.querySelectorAll(".pad .btn").forEach(b=>b.onclick=()=>cambia(b.dataset.d));
  let tocco=null;
  cv.addEventListener("touchstart",e=>{ tocco=[e.touches[0].clientX,e.touches[0].clientY]; },{passive:true});
  cv.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
  cv.addEventListener("touchend",e=>{
    if(!tocco) return; const dx=e.changedTouches[0].clientX-tocco[0], dy=e.changedTouches[0].clientY-tocco[1]; tocco=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    cambia(Math.abs(dx)>Math.abs(dy)?(dx>0?"d":"a"):(dy>0?"s":"w"));
  });
  $("#via").onclick=()=>{ $("#via").blur(); inizia(); };
  window.onresize=ridimensiona; ridimensiona();
  ferma=()=>{ clearTimeout(timer); s=null; document.onkeydown=null; window.onresize=null; };
}

/* ----------------------------------------------------------- campo minato */
const LIVELLI_CM={facile:[9,9,10],media:[12,16,30],difficile:[16,20,60]};
let cm=null;
function impostaCampoMinato(){
  app.innerHTML=`<h2>Campo minato</h2><p class="sub">Scopri tutte le caselle senza mine. Ogni numero dice quante mine ci sono nelle 8 caselle intorno. La prima casella non è mai una mina.</p>
  <div class="panel"><div class="row">
    <div><label>Difficoltà</label><select id="liv"><option value="facile">Facile (9 × 9, 10 mine)</option><option value="media">Media (12 × 16, 30 mine)</option><option value="difficile">Difficile (16 × 20, 60 mine)</option><option value="pers">Personalizzata</option></select></div>
    <div id="persWrap" class="hidden row" style="margin:0">
      <div><label>Righe</label><input type="number" id="pr" min="5" max="30" value="10" style="width:75px"></div>
      <div><label>Colonne</label><input type="number" id="pc" min="5" max="30" value="10" style="width:75px"></div>
      <div><label>Mine</label><input type="number" id="pm" min="1" value="15" style="width:75px"></div></div>
  </div><div id="err"></div><button class="btn primary" id="via">Gioca</button></div>`;
  $("#liv").onchange=()=>$("#persWrap").classList.toggle("hidden",$("#liv").value!=="pers");
  $("#via").onclick=()=>{
    let r,c,m;
    if($("#liv").value==="pers"){
      r=Math.floor(+$("#pr").value); c=Math.floor(+$("#pc").value); m=Math.floor(+$("#pm").value);
      if(!(r>=5&&r<=30&&c>=5&&c<=30)) return $("#err").innerHTML='<div class="msg err">Righe e colonne devono essere da 5 a 30.</div>';
      if(!(m>=1&&m<=r*c-1)) return $("#err").innerHTML=`<div class="msg err">Le mine devono essere da 1 a ${r*c-1}.</div>`;
    }else [r,c,m]=LIVELLI_CM[$("#liv").value];
    nuovaPartitaCM(r,c,m);
  };
}
function nuovaPartitaCM(r,c,m){
  if(cm) clearInterval(cm.timer);
  cm={r,c,m,celle:Array.from({length:r*c},()=>({mina:false,vista:false,flag:false,n:0})),piazzate:false,fine:null,inizio:0,timer:null,modo:"scopri"};
  disegnaCM();
}
function vicineCM(i){
  const y=Math.floor(i/cm.c), x=i%cm.c, out=[];
  for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){ if((a||b)&&y+a>=0&&y+a<cm.r&&x+b>=0&&x+b<cm.c) out.push((y+a)*cm.c+x+b); }
  return out;
}
// le mine vengono messe dopo il primo clic, lontano dalla casella scelta
function piazzaMineCM(primo){
  const vietate=new Set([primo]);
  if(cm.r*cm.c-cm.m>=9) vicineCM(primo).forEach(i=>vietate.add(i));
  const libere=cm.celle.map((_,i)=>i).filter(i=>!vietate.has(i));
  for(let k=0;k<cm.m;k++){ const j=k+casuale(libere.length-k); [libere[k],libere[j]]=[libere[j],libere[k]]; cm.celle[libere[k]].mina=true; }
  cm.celle.forEach((cl,i)=>cl.n=vicineCM(i).filter(j=>cm.celle[j].mina).length);
  cm.piazzate=true; cm.inizio=Date.now();
  cm.timer=setInterval(()=>{ const t=$("#cmTempo"); if(t) t.textContent=Math.floor((Date.now()-cm.inizio)/1000); },1000);
}
function scopriCM(i){
  const pila=[i];
  while(pila.length){
    const k=pila.pop(), cl=cm.celle[k];
    if(cl.vista||cl.flag) continue;
    cl.vista=true;
    if(cl.mina){ cm.fine={vinto:false,boom:k}; continue; }
    if(cl.n===0) vicineCM(k).forEach(j=>pila.push(j));
  }
  if(!cm.fine&&cm.celle.every(cl=>cl.mina||cl.vista)) cm.fine={vinto:true};
  if(cm.fine){
    clearInterval(cm.timer);
    if(cm.fine.vinto) cm.celle.forEach(cl=>{ if(cl.mina) cl.flag=true; });
  }
}
function azioneCM(i,bandiera){
  if(cm.fine) return;
  const cl=cm.celle[i];
  if(bandiera){ if(!cl.vista) cl.flag=!cl.flag; return disegnaCM(); }
  if(cl.flag) return;
  if(cl.vista){
    // clic su un numero con tutte le bandiere intorno: scopre le altre caselle vicine
    const v=vicineCM(i);
    if(cl.n>0&&v.filter(j=>cm.celle[j].flag).length===cl.n) v.forEach(j=>{ if(!cm.fine) scopriCM(j); });
    return disegnaCM();
  }
  if(!cm.piazzate) piazzaMineCM(i);
  scopriCM(i); disegnaCM();
}
function disegnaCM(){
  const f=cm.fine, bandiere=cm.celle.filter(cl=>cl.flag).length;
  const sec=cm.piazzate?Math.floor(((f?cm.fineT||(cm.fineT=Date.now()):Date.now())-cm.inizio)/1000):0;
  const lato=Math.max(26,Math.min(36,Math.floor((Math.min(innerWidth,900)-70)/cm.c)));
  const celle=cm.celle.map((cl,i)=>{
    let cls="cm-c", txt="";
    const mostra=f&&!f.vinto;
    if(cl.vista&&!cl.mina){ cls+=" aperta"; if(cl.n){ txt=cl.n; cls+=" n"+cl.n; } }
    else if(cl.flag&&mostra&&!cl.mina){ cls+=" sbagliata"; txt="✕"; }
    else if(cl.flag){ txt="🚩"; }
    else if(cl.mina&&(cl.vista||mostra)){ cls+=" mina"+(f&&f.boom===i?" boom":""); txt="💣"; }
    return `<button class="${cls}" data-i="${i}" aria-label="riga ${Math.floor(i/cm.c)} colonna ${i%cm.c}">${txt}</button>`;
  }).join("");
  app.innerHTML=`<h2>Campo minato</h2>
  <div class="score"><span>💣 Mine: <b>${cm.m-bandiere}</b></span><span>⏱ Tempo: <b id="cmTempo">${sec}</b> s</span></div>
  ${f?`<div class="msg ${f.vinto?"ok":"err"}">${f.vinto?`🏆 Hai vinto in ${sec} secondi!`:"💥 BOOM! Hai preso una mina."}</div>`:""}
  <div class="row"><button class="btn ${cm.modo==="scopri"?"sel":""}" id="mScopri">⛏ Scopri</button><button class="btn ${cm.modo==="bandiera"?"sel":""}" id="mFlag">🚩 Bandiera</button>
    <span class="sub" style="font-size:14px">Tasto destro o tieni premuto per mettere una bandiera</span></div>
  <div class="cm-wrap"><div class="cm ${f?"off":""}" style="grid-template-columns:repeat(${cm.c},${lato}px);grid-auto-rows:${lato}px">${celle}</div></div>
  <div class="row"><button class="btn primary" id="ancora">${f?"Nuova partita":"Ricomincia"}</button><button class="btn" onclick="impostaCampoMinato()">Cambia difficoltà</button></div>`;
  $("#mScopri").onclick=()=>{ cm.modo="scopri"; disegnaCM(); };
  $("#mFlag").onclick=()=>{ cm.modo="bandiera"; disegnaCM(); };
  $("#ancora").onclick=()=>nuovaPartitaCM(cm.r,cm.c,cm.m);
  app.querySelectorAll(".cm-c").forEach(b=>{
    const i=+b.dataset.i; let premuto=null, lungo=false;
    b.onclick=()=>{ if(lungo){ lungo=false; return; } azioneCM(i,cm.modo==="bandiera"); };
    b.oncontextmenu=e=>{ e.preventDefault(); azioneCM(i,true); };
    b.addEventListener("touchstart",()=>{ lungo=false; premuto=setTimeout(()=>{ lungo=true; azioneCM(i,true); },450); },{passive:true});
    b.addEventListener("touchend",()=>clearTimeout(premuto));
    b.addEventListener("touchmove",()=>clearTimeout(premuto),{passive:true});
  });
}

/* ----------------------------------------------------------------- sudoku */
let sd=null;
function sdValido(g,i,n){
  const r=Math.floor(i/9), c=i%9, r0=r-r%3, c0=c-c%3;
  for(let k=0;k<9;k++){
    if(k!==c&&g[r*9+k]===n) return false;
    if(k!==r&&g[k*9+c]===n) return false;
    const j=(r0+Math.floor(k/3))*9+c0+k%3;
    if(j!==i&&g[j]===n) return false;
  }
  return true;
}
function mescola(a){ for(let i=a.length-1;i>0;i--){ const j=casuale(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sdRiempi(g){
  const i=g.indexOf(0); if(i<0) return true;
  for(const n of mescola([1,2,3,4,5,6,7,8,9])){ if(sdValido(g,i,n)){ g[i]=n; if(sdRiempi(g)) return true; g[i]=0; } }
  return false;
}
// conta le soluzioni fermandosi a 2: serve solo sapere se e' unica
function sdConta(g){
  const i=g.indexOf(0); if(i<0) return 1;
  let tot=0;
  for(let n=1;n<=9&&tot<2;n++){ if(sdValido(g,i,n)){ g[i]=n; tot+=sdConta(g); g[i]=0; } }
  return tot;
}
function sdGenera(daTogliere){
  const sol=Array(81).fill(0); sdRiempi(sol);
  const g=sol.slice(); let tolti=0;
  for(const i of mescola([...Array(81).keys()])){
    if(tolti>=daTogliere) break;
    const v=g[i]; g[i]=0;
    if(sdConta(g)!==1) g[i]=v; else tolti++;
  }
  return {sol,g};
}
function impostaSudoku(){
  app.innerHTML=`<h2>Sudoku</h2><p class="sub">Ogni riga, colonna e quadrato 3×3 deve contenere i numeri da 1 a 9 una sola volta. Ogni sudoku ha una sola soluzione.</p>
  <div class="panel"><label>Difficoltà</label><select id="liv"><option value="40">Facile</option><option value="48">Media</option><option value="56">Difficile</option></select>
  <div class="row"><button class="btn primary" id="via">Gioca</button></div></div>`;
  $("#via").onclick=()=>{
    const {sol,g}=sdGenera(+$("#liv").value);
    sd={sol,g,fisse:g.map(v=>v>0),note:Array.from({length:81},()=>new Set()),sel:g.indexOf(0),matita:false,aiuti:0,controlla:false,inizio:Date.now(),fine:null,storia:[]};
    sd.timer=setInterval(()=>{ const t=$("#sdTempo"); if(t&&!sd.fine) t.textContent=tempoSd(); },1000);
    ferma=()=>{ clearInterval(sd.timer); document.onkeydown=null; };
    document.onkeydown=tastoSudoku;
    disegnaSudoku();
  };
}
function tempoSd(){ const s=Math.floor(((sd.fine||Date.now())-sd.inizio)/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function scriviSd(i,n){
  if(sd.fine||i<0||sd.fisse[i]) return;
  sd.storia.push({i,v:sd.g[i],note:new Set(sd.note[i])});
  if(sd.matita&&n){
    if(sd.g[i]) return;
    sd.note[i].has(n)?sd.note[i].delete(n):sd.note[i].add(n);
  }else{
    sd.g[i]=(n&&sd.g[i]!==n)?n:0; sd.note[i].clear();
    // il numero inserito toglie le note uguali nella stessa riga, colonna e quadrato
    if(sd.g[i]) for(let j=0;j<81;j++) if(vicinaSd(i,j)) sd.note[j].delete(n);
  }
  sd.controlla=false;
  if(sd.g.every((v,k)=>v===sd.sol[k])){ sd.fine=Date.now(); clearInterval(sd.timer); }
  disegnaSudoku();
}
function vicinaSd(a,b){
  const ra=Math.floor(a/9),ca=a%9,rb=Math.floor(b/9),cb=b%9;
  return ra===rb||ca===cb||(Math.floor(ra/3)===Math.floor(rb/3)&&Math.floor(ca/3)===Math.floor(cb/3));
}
function tastoSudoku(e){
  if(!sd||e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  const k=e.key, mosse={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1};
  if(k in mosse){
    e.preventDefault();
    if(sd.sel<0) sd.sel=0;
    const r=Math.floor(sd.sel/9), c=sd.sel%9;
    if(k==="ArrowUp"&&r>0||k==="ArrowDown"&&r<8||k==="ArrowLeft"&&c>0||k==="ArrowRight"&&c<8) sd.sel+=mosse[k];
    return disegnaSudoku();
  }
  if(/^[1-9]$/.test(k)) return scriviSd(sd.sel,+k);
  if(k==="Backspace"||k==="Delete"||k==="0") return scriviSd(sd.sel,0);
  if(k==="n"||k==="N"){ sd.matita=!sd.matita; disegnaSudoku(); }
  if((k==="z"||k==="Z")&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); annullaSd(); }
}
function annullaSd(){
  const u=sd.storia.pop(); if(!u||sd.fine) return;
  sd.g[u.i]=u.v; sd.note[u.i]=u.note; sd.sel=u.i; disegnaSudoku();
}
function disegnaSudoku(){
  const sel=sd.sel, numSel=sel>=0?sd.g[sel]:0;
  const contati=Array(10).fill(0); sd.g.forEach(v=>contati[v]++);
  const celle=sd.g.map((v,i)=>{
    const r=Math.floor(i/9), c=i%9;
    let cls="sd-c";
    if(sd.fisse[i]) cls+=" fissa";
    if(c%3===2&&c<8) cls+=" bordo-d";
    if(r%3===2&&r<8) cls+=" bordo-b";
    if(i===sel) cls+=" sel"; else if(sel>=0&&vicinaSd(i,sel)) cls+=" zona";
    if(v&&v===numSel&&i!==sel) cls+=" uguale";
    if(v&&!sdValido(sd.g,i,v)) cls+=" conflitto";
    if(sd.controlla&&v&&!sd.fisse[i]&&v!==sd.sol[i]) cls+=" errore";
    const txt=v?v:`<div class="note">${[1,2,3,4,5,6,7,8,9].map(n=>`<span>${sd.note[i].has(n)?n:""}</span>`).join("")}</div>`;
    return `<button class="${cls}" data-i="${i}" aria-label="riga ${r+1} colonna ${c+1}${v?", "+v:""}">${txt}</button>`;
  }).join("");
  const errori=sd.controlla?sd.g.filter((v,i)=>v&&!sd.fisse[i]&&v!==sd.sol[i]).length:0;
  app.innerHTML=`<h2>Sudoku</h2>
  <div class="score"><span>⏱ <b id="sdTempo">${tempoSd()}</b></span><span>Aiuti: <b>${sd.aiuti}</b></span><span>Caselle vuote: <b>${sd.g.filter(v=>!v).length}</b></span></div>
  ${sd.arreso?`<div class="msg">Ecco la soluzione. Riprova con un nuovo sudoku!</div>`:sd.fine?`<div class="msg ok">🏆 Complimenti, hai risolto il sudoku in ${tempoSd()}${sd.aiuti?` con ${sd.aiuti} aiut${sd.aiuti===1?"o":"i"}`:""}!</div>`
    :sd.controlla?`<div class="msg ${errori?"err":"ok"}">${errori?(errori===1?"C'è 1 numero sbagliato (in rosso).":`Ci sono ${errori} numeri sbagliati (in rosso).`):"Per ora nessun errore!"}</div>`:""}
  <div class="sd-gioco">
    <div class="sd ${sd.fine?"off":""}">${celle}</div>
    <div class="sd-lato">
      <div class="sd-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-n="${n}" ${contati[n]>=9?"disabled":""}>${n}</button>`).join("")}</div>
      <div class="sd-azioni">
        <button class="btn ${sd.matita?"sel":""}" id="sdMatita" title="Tasto N">✏️ Note ${sd.matita?"ON":"OFF"}</button>
        <button class="btn" id="sdCancella">⌫ Cancella</button>
        <button class="btn" id="sdAnnulla" title="Ctrl+Z">↶ Annulla</button>
        <button class="btn" id="sdControlla">✔ Controlla</button>
        <button class="btn" id="sdAiuto">💡 Aiuto</button>
        <button class="btn" id="sdArrenditi">🏳 Soluzione</button>
      </div>
    </div>
  </div>
  <p class="sub" style="margin-top:12px;font-size:14px">Tastiera: frecce per muoverti, 1-9 per scrivere, Canc per cancellare, N per le note.</p>
  <div class="row"><button class="btn primary" onclick="vai('sudoku')">Nuovo sudoku</button><button class="btn" onclick="vai('menu')">Menu</button></div>`;
  app.querySelectorAll(".sd-c").forEach(b=>b.onclick=()=>{ sd.sel=+b.dataset.i; disegnaSudoku(); });
  app.querySelectorAll(".sd-pad .btn").forEach(b=>b.onclick=()=>scriviSd(sd.sel,+b.dataset.n));
  $("#sdMatita").onclick=()=>{ sd.matita=!sd.matita; disegnaSudoku(); };
  $("#sdCancella").onclick=()=>scriviSd(sd.sel,0);
  $("#sdAnnulla").onclick=annullaSd;
  $("#sdControlla").onclick=()=>{ if(sd.fine) return; sd.controlla=true; disegnaSudoku(); };
  $("#sdAiuto").onclick=()=>{
    if(sd.fine) return;
    // mette il numero giusto nella casella selezionata, o nella prima vuota/sbagliata
    let i=(sel>=0&&!sd.fisse[sel]&&sd.g[sel]!==sd.sol[sel])?sel:sd.g.findIndex((v,k)=>v!==sd.sol[k]);
    if(i<0) return;
    const m=sd.matita; sd.matita=false; sd.aiuti++; sd.sel=i; scriviSd(i,sd.sol[i]); sd.matita=m; disegnaSudoku();
  };
  $("#sdArrenditi").onclick=()=>{
    if(sd.fine||!confirm("Vuoi vedere la soluzione? La partita finisce.")) return;
    sd.g=sd.sol.slice(); sd.arreso=true; sd.fine=Date.now(); clearInterval(sd.timer); disegnaSudoku();
  };
}

mostraMenu();
</script>
